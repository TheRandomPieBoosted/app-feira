<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6B38">
<title>Feira · Rede Raízes da Mata</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#F4F7F2;color:#1C2A1E;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{min-height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.topo{background:#2F6B38;color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5}
.topo h1{margin:0;font-size:17px;font-weight:700}
.topo .volta,.topo .olho{min-height:44px;min-width:44px;background:none;border:0;color:#fff;font-weight:600;font-size:15px;padding:0 4px;border-radius:10px}
.topo .olho{background:#3F7D47}
.capa{background:#2F6B38;color:#fff;padding:24px 18px 20px}
.capa small{color:#DCEBDD;font-size:13px;font-weight:500}
.capa h1{margin:2px 0;font-size:26px;line-height:1.15}
.capa p{margin:0;color:#DCEBDD;font-size:14px}
.capa .linha{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.capa .olho{min-height:44px;min-width:64px;background:#3F7D47;border:0;color:#fff;font-weight:600;font-size:15px;padding:0 10px;border-radius:10px}
.selo.aporte{background:#E3F0FA;color:#1F5C8A}
.selo.enc{background:#FAEEDA;color:#633806}
.cartao.enc{border-color:#EF9F27}
.editando{background:#FAEEDA;color:#633806;border-radius:10px;padding:10px 12px;font-size:14px}
.corpo{padding:14px;display:flex;flex-direction:column;gap:12px;flex:1}
.cartao{background:#fff;border:1px solid #D5DED3;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.cartao h2{margin:0;font-size:15px;font-weight:600}
.sub{font-size:13px;color:#4A5A4C}
.linha{display:flex;justify-content:space-between;align-items:center;gap:10px}
.num{font-size:24px;font-weight:700}
.selo{font-size:12px;font-weight:600;color:#2F6B38;background:#E3EFE2;border-radius:999px;padding:4px 10px}
.selo.alerta{color:#5A4708;background:#FFF0C2}
.b{min-height:48px;padding:0 14px;border-radius:12px;border:1px solid #9DB89F;background:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;text-align:center}
.b.p{background:#2F6B38;border-color:#2F6B38;color:#fff}
.b.g{min-height:60px;font-size:18px;font-weight:700;border-radius:14px}
.b.perigo{color:#8A2C1F;border-color:#D9A79F}
.b:disabled{background:#E6ECE4;border-color:#D5DED3;color:#6B766C}
.duas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.aviso{background:#FFF6DD;border:1px solid #E5CF8F;border-radius:12px;padding:10px 12px;font-size:13px;color:#5A4708}
.erro{background:#FBE9E6;border:1px solid #D9A79F;border-radius:12px;padding:10px 12px;font-size:14px;color:#7A2418}
.ok{background:#E9F1E7;border:1px solid #C3D0C1;border-radius:12px;padding:10px 12px;font-size:14px}
label.rot{font-size:13px;font-weight:600;color:#4A5A4C}
input.campo,select.campo,textarea.campo{width:100%;min-height:46px;padding:8px 12px;background:#fff;border:1px solid #9DB89F;border-radius:10px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:0 12px;border-radius:10px;border:1px solid #C3D0C1;background:#fff;font-size:14px;font-weight:500}
.chip.on{background:#2F6B38;border-color:#2F6B38;color:#fff;font-weight:700}
.chip.novo{border-style:dashed;border-color:#7FA283;color:#2F6B38;background:#F4F7F2;font-weight:600}
.prods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.prod{min-height:54px;padding:6px 10px;text-align:left;border-radius:10px;border:1px solid #C3D0C1;background:#fff;font-size:13px;line-height:1.25;font-weight:500}
.prod b{display:block;font-size:14px}
.prod.sem{border-style:dashed;color:#4A5A4C}
.item{display:flex;align-items:center;gap:6px;min-height:54px;border-bottom:1px solid #E6ECE4;padding:4px 0}
.item:last-child{border-bottom:0}
.item .nome{flex:1;min-width:0;font-size:14px;font-weight:500}
.item .q{width:26px;text-align:center;font-weight:700}
.mm{width:44px;height:44px;border-radius:10px;border:1px solid #C3D0C1;background:#F4F7F2;color:#2F6B38;font-size:20px;font-weight:700}
.preco{min-width:78px;min-height:44px;text-align:right;background:none;border:0;border-bottom:1px dashed #9DB89F;font-weight:600;font-size:14px;padding:0 2px}
.rodape{background:#fff;border-top:1px solid #D5DED3;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;bottom:0}
.formas{display:grid;gap:6px}
.venda{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:62px;border-bottom:1px solid #E6ECE4;padding:6px 0}
.venda:last-child{border-bottom:0}
.venda .quem{font-size:15px;font-weight:600}
.riscada .quem,.riscada .val{text-decoration:line-through;color:#6B766C}
.marca{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;font-weight:500}
.marca input{width:22px;height:22px;accent-color:#2F6B38}
.pix{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border:1px solid #D5DED2;border-radius:14px;padding:12px;margin:10px 0;text-align:center}
.pix svg{width:min(72vw,300px);height:min(72vw,300px);display:block}
.pix .quanto{font-size:20px;font-weight:700}
pre.recibo{white-space:pre-wrap;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;background:#F4F7F2;border-radius:10px;padding:10px;margin:0}
</style>
</head>
<body>
<div id="app"></div>

function estadoVazio() {

}
let erroGuardar = "";
function ler() {

  return estadoVazio();
}

  catch (e) { erroGuardar = "Não consegui guardar neste aparelho (memória cheia ou navegação privada). Exporte as vendas agora."; }
}
let S = ler();
limparAntigas();

// ---------------------------------------------------------------- estado da tela (não guardado)
function vendaNova() { return { consumidor: null, itens: [], forma: "Dinheiro", dividir: false, forma2: "", valor2: "", conta: "", conta2: "", entregar: false, obs: "" }; }
function aporteNovo() { return { consumidor: null, itens: [], aporte: true, valorAporte: "", forma: "Pix", dividir: false, forma2: "", valor2: "", conta: "", conta2: "", entregar: false, obs: "" }; }
let T = { tela: "inicio", v: vendaNova(), buscaC: "", buscaP: "", todos: false, detalhe: null, msg: "", erro: "", confirmar: "", editarPreco: null, clienteNovo: false, ultima: null };

// ---------------------------------------------------------------- utilidades
const $ = (s) => document.querySelector(s);
function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function chave(t) { return String(t || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim(); }
function r2(v) { return Math.round((Number(v) || 0) * 100) / 100; }
function brl(v) { const n = r2(v); return (n < 0 ? "−" : "") + "R$ " + Math.abs(n).toFixed(2).replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
function valor(v) { return S.cfg.esconder ? "R$ ••••" : brl(v); }
function num(t) { const n = parseFloat(String(t).replace(/\./g, "").replace(",", ".")); return isNaN(n) ? 0 : n; }
function numDigitado(t) { const s = String(t).trim(); const n = parseFloat(s.indexOf(",") >= 0 ? s.replace(/\./g, "").replace(",", ".") : s); return isNaN(n) ? 0 : n; }
function p2(n) { return String(n).padStart(2, "0"); }
function hojeISO() { const d = new Date(); return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }
function horaAgora() { const d = new Date(); return p2(d.getHours()) + ":" + p2(d.getMinutes()); }
function dataBR(iso) { return iso ? iso.slice(8, 10) + "/" + iso.slice(5, 7) + "/" + iso.slice(0, 4) : ""; }
function qtd(q) { return String(r2(q)).replace(".", ","); }

// ---------------------------------------------------------------- dados do pacote
function consumidores() {
  const base = (S.pacote ? S.pacote.consumidores : []).map((c) => Object.assign({ novo: false }, c));
  const novos = S.novos.map((n) => ({ nome: n.nome, busca: chave(n.nome), saldo: 0, disponivel: 0, frequente: false, compras: [], novo: true, contato: n.contato }));
  return base.concat(novos);
}
function consumidor(nome) { return consumidores().find((c) => c.nome === nome) || null; }
function produtos() { return S.pacote ? S.pacote.produtos : []; }
function produto(sku) { return produtos().find((p) => p.sku === sku) || null; }
function contas() { return S.pacote ? S.pacote.contas : []; }
function contaDoDia() { return S.cfg.contaDia || (S.pacote && S.pacote.conta_do_dia) || contas()[0] || ""; }
function contaPadrao(forma) {
  if (forma === "Saldo" || !forma) return "";
  const fixa = S.pacote && S.pacote.conta_forma ? S.pacote.conta_forma[forma] : null;
  return fixa && contas().indexOf(fixa) >= 0 ? fixa : contaDoDia();
}

// ---------------------------------------------------------------- Pix: QR da conta com o valor da venda
/* O pacote traz, por conta, o código "Pix copia e cola" fixo (sem valor). Aqui o app monta o mesmo código
   com o valor da venda (campo 54) e refaz o verificador do fim (campo 63, CRC16). Nada sai do aparelho. */
function pixCampos(t) {
  const cs = []; let i = 0;
  while (i < t.length) {
    const n = t.slice(i, i + 2), tam = parseInt(t.slice(i + 2, i + 4), 10), v = t.slice(i + 4, i + 4 + tam);
    if (!/^\d{4}$/.test(t.slice(i, i + 4)) || v.length !== tam) return null;
    cs.push([n, v]); i += 4 + tam;
  }
  return cs;
}
function pixCrc(t) {
  let crc = 0xFFFF;
  for (const b of new TextEncoder().encode(t)) {
    crc ^= b << 8;
    for (let k = 0; k < 8; k++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
  }
  return crc.toString(16).toUpperCase().padStart(4, "0");
}
function pixInfo(cod) {
  const cs = cod ? pixCampos(cod) : null;
  if (!cs || !cs.length || cs[cs.length - 1][0] !== "63" || pixCrc(cod.slice(0, -4)) !== cs[cs.length - 1][1].toUpperCase()) return null;
  const d = {}; cs.forEach((c) => { d[c[0]] = c[1]; });
  return { campos: cs, recebedor: (d["59"] || "").trim() };
}
function pixComValor(cod, v) {
  const info = pixInfo(cod); if (!info) return "";
  if (!(r2(v) > 0)) return cod;
  const cs = info.campos.filter((c) => c[0] !== "54" && c[0] !== "63");
  cs.push(["54", r2(v).toFixed(2)]);
  cs.sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
  const corpo = cs.map((c) => c[0] + p2(c[1].length) + c[1]).join("") + "6304";
  return corpo + pixCrc(corpo);
}
function qrSvg(texto) {
  qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
  const q = qrcode(0, "M"); q.addData(texto, "Byte"); q.make();
  const n = q.getModuleCount(), b = 4; let d = "";
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) d += "M" + (x + b) + "," + (y + b) + "h1v1h-1z";
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + (n + 2 * b) + " " + (n + 2 * b) + '" shape-rendering="crispEdges" role="img" aria-label="QR do Pix"><rect width="100%" height="100%" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
}
function pixDaConta(conta) { return (S.pacote && S.pacote.pix && S.pacote.pix[conta]) || ""; }
// Parte da venda em aberto que é paga em Pix: {conta, valor} ou null.
function partePix() {
  const v = T.v;
  if (v.aporte) return v.forma === "Pix" ? { conta: v.conta || contaPadrao("Pix"), valor: r2(numDigitado(v.valorAporte)) } : null;
  const total = totalItens(v.itens), v2 = v.dividir ? numDigitado(v.valor2) : 0;
  if (v.forma === "Pix") {
    if (v.dividir && !(v2 > 0 && v2 < total)) return null;
    return { conta: v.conta || contaPadrao("Pix"), valor: r2(total - v2) };
  }
  if (v.dividir && v.forma2 === "Pix" && v2 > 0 && v2 < total) return { conta: v.conta2 || contaPadrao("Pix"), valor: r2(v2) };
  return null;
}
function blocoPix() {
  const v = T.v;
  if (!(v.forma === "Pix" || (v.dividir && v.forma2 === "Pix"))) return "";
  const p = partePix();
  if (!p) return '<div class="sub">O QR do Pix aparece quando o valor da segunda forma estiver digitado.</div>';
  if (!(p.valor > 0)) return v.aporte ? '<div class="sub">O QR do Pix aparece quando o valor estiver digitado.</div>' : "";
  const cod = pixDaConta(p.conta);
  if (!cod) return '<div class="sub">' + esc(p.conta) + ' não tem QR do Pix no pacote. No computador: Configurações → Contas → QR do Pix, e gere o pacote de novo.</div>';
  const info = pixInfo(cod), pronto = pixComValor(cod, p.valor);
  if (!info || !pronto) return '<div class="aviso">O QR do Pix de ' + esc(p.conta) + ' veio com problema no pacote. Confira no computador.</div>';
  let desenho;
  try { desenho = qrSvg(pronto); } catch (e) { return '<div class="aviso">Não consegui desenhar o QR do Pix.</div>'; }
  return '<div class="pix">' + desenho + '<div class="quanto">Pix de ' + brl(p.valor) + '</div><div class="sub">Entra em ' + esc(p.conta) + (info.recebedor ? " · " + esc(info.recebedor) : "") + '<br>O valor já vai no QR. Confira o nome antes de o cliente confirmar.</div></div>';
}

// ---------------------------------------------------------------- contas da venda
function totalItens(itens) { return r2(itens.reduce((s, i) => s + i.quantidade * i.preco, 0)); }
function partes(v) {
  const total = v.total != null ? v.total : totalItens(v.itens);
  if (v.pagamento2) return [{ forma: v.pagamento, conta: v.conta, valor: r2(total - v.valor2) }, { forma: v.pagamento2, conta: v.conta2, valor: r2(v.valor2) }];
  return [{ forma: v.pagamento, conta: v.conta, valor: total }];
}
function parteSaldo(v) { return r2(partes(v).filter((p) => p.forma === "Saldo").reduce((s, p) => s + p.valor, 0)); }
function pagamentoTexto(v) { const ps = partes(v); return ps.length > 1 ? ps.map((p) => p.forma + " " + brl(p.valor)).join(" + ") : ps[0].forma + (ps[0].conta ? " → " + ps[0].conta : ""); }
function ehAporte(v) { return v.tipo === "aporte"; }
function vendasValidas() { return S.vendas.filter((v) => !fora(v) && !ehAporte(v) && (!ehEncomenda(v) || v.cobrada)); }
function aportesValidos() { return S.vendas.filter((v) => !fora(v) && ehAporte(v)); }
function registrosValidos() { return S.vendas.filter((v) => !fora(v)); }
function aporteHoje(nome) { return r2(aportesValidos().filter((v) => v.consumidor === nome).reduce((s, v) => s + v.total, 0)); }
function gastoHoje(nome) { return r2(vendasValidas().filter((v) => v.consumidor === nome).reduce((s, v) => s + parteSaldo(v), 0)); }
function saldoAgora(c) { return r2(c.saldo - gastoHoje(c.nome) + aporteHoje(c.nome)); }
function quemDe(v) { return v.consumidor || "Venda avulsa"; }
// 0.7/1.3: encomenda = venda montada e ainda não cobrada (vem do pacote ou é feita aqui)
function ehEncomenda(v) { return v.tipo === "encomenda"; }
function fora(v) { return !!(v.desfeita || v.substituidaPor); }                 // não vale mais (desfeita ou editada)
function emCurso(v) { return ehEncomenda(v) && !v.cobrada && !fora(v); }
function encomendasPacote() {
  const locais = new Set(S.vendas.map((v) => v.codigo));
  return ((S.pacote && S.pacote.encomendas) || []).filter((e) => !locais.has(e.codigo)).map((e) => ({
    tipo: "encomenda", fromPacote: true, codigo: e.codigo, data: e.data, hora: "", consumidor: e.consumidor,
    itens: e.itens.map((i) => ({ sku: i.sku, nome: i.nome, quantidade: i.quantidade, preco: r2(i.preco) })),
    total: r2(e.total), pagamento: "A cobrar", conta: "", pagamento2: "", valor2: 0, conta2: "", obs: e.obs || "", desfeita: false }));
}
function encomendasEmCurso() { return S.vendas.filter(emCurso).concat(encomendasPacote()); }
function registro(codigo) { return S.vendas.find((x) => x.codigo === codigo) || encomendasPacote().find((x) => x.codigo === codigo) || null; }
function guardarRegistro(r) {            // encomenda do pacote: na primeira mexida vira registro deste celular
  if (S.vendas.indexOf(r) < 0) S.vendas.push(r);
  r.pendente = true; S.exportadoEm = "";
}
function novoCodigo() { S.seq += 1; return S.cfg.apelido + "-" + hojeISO().replace(/-/g, "") + "-" + String(S.seq).padStart(3, "0"); }
function limparAntigas() {
  // guarda só as 2 últimas feiras já exportadas; nunca apaga o que não foi exportado nem encomenda em curso
  const exportadas = S.vendas.filter((v) => v.exportado && !v.pendente && !emCurso(v));
  const datas = Array.from(new Set(exportadas.map((v) => v.data))).sort().reverse().slice(0, 2);
  const antes = S.vendas.length;
  S.vendas = S.vendas.filter((v) => !(v.exportado && !v.pendente && !emCurso(v)) || datas.indexOf(v.data) >= 0);
  if (S.vendas.length !== antes) guardar();
}

// ---------------------------------------------------------------- ações
function ir(tela) { T.tela = tela; T.erro = ""; T.confirmar = ""; T.editarPreco = null; T.clienteNovo = false; desenhar(); window.scrollTo(0, 0); }

function carregarPacote(arquivo) {
  const leitor = new FileReader();
  leitor.onload = () => {
    try {
      const d = JSON.parse(String(leitor.result).replace(/^﻿/, ""));
      if (!d || d.tipo !== "pacote_feira" || !Array.isArray(d.produtos) || !Array.isArray(d.consumidores)) throw new Error("x");
      if (d.versao !== 1) { T.erro = "Este pacote é de uma versão que este app não conhece. Atualize o app (abra com internet)."; desenhar(); return; }
      S.pacote = d;
      if (!S.cfg.contaDia || d.contas.indexOf(S.cfg.contaDia) < 0) S.cfg.contaDia = d.conta_do_dia || d.contas[0] || "";
      // clientes novos que já entraram no programa deixam de ser "novos"
      S.novos = S.novos.filter((n) => !d.consumidores.some((c) => c.busca === chave(n.nome)));
      guardar();
      T.msg = "Pacote carregado: " + d.resumo.produtos + " produtos e " + d.resumo.consumidores + " consumidores" + (d.resumo.encomendas ? " e " + d.resumo.encomendas + " encomenda(s)" : "") + "."; T.erro = "";
    } catch (e) { T.erro = "Este arquivo não é um pacote da feira. Gere o pacote no programa (Feiras → App do celular)."; }
    desenhar();
  };
  leitor.onerror = () => { T.erro = "Não consegui abrir o arquivo."; desenhar(); };
  leitor.readAsText(arquivo);
}

function adicionar(sku) {
  const p = produto(sku); if (!p) return;
  const it = T.v.itens.find((i) => i.sku === sku);
  if (it) it.quantidade = r2(it.quantidade + 1);
  else T.v.itens.push({ sku: p.sku, nome: p.nome_lista || p.nome, quantidade: 1, preco: r2(p.preco) });
  T.buscaP = ""; T.erro = "";
  if (!p.preco) T.editarPreco = sku;
  desenhar();
}
function mudarQtd(sku, d) {
  const it = T.v.itens.find((i) => i.sku === sku); if (!it) return;
  it.quantidade = r2(it.quantidade + d);
  if (it.quantidade <= 0) T.v.itens = T.v.itens.filter((i) => i.sku !== sku);
  desenhar();
}
function escolherConsumidor(nome) {
  T.v.consumidor = nome; T.buscaC = ""; T.clienteNovo = false; T.erro = "";
  if (T.v.aporte) { desenhar(); return; }
  if (nome && T.v.forma === "Dinheiro" && !T.v.tocouForma) T.v.forma = "Saldo";
  if (!nome && T.v.forma === "Saldo") T.v.forma = "Dinheiro";
  desenhar();
}
function criarCliente() {
  const nome = ($("#cn-nome").value || "").replace(/\s+/g, " ").trim();
  const contato = ($("#cn-tel").value || "").trim();
  if (!nome) { T.erro = "Digite o nome do cliente."; desenhar(); return; }
  if (consumidores().some((c) => c.busca === chave(nome))) { T.erro = "Já existe alguém com esse nome. Escolha na busca."; desenhar(); return; }
  S.novos.push({ nome: nome, contato: contato }); guardar();
  escolherConsumidor(nome);
}

function conferirVenda() {
  const v = T.v, total = totalItens(v.itens);
  if (!v.itens.length) return "Escolha pelo menos um produto.";
  if (v.itens.some((i) => !(i.preco > 0))) return "Há produto sem preço: toque no preço para digitar.";
  if (total <= 0) return "O total precisa ser maior que zero.";
  const usaSaldo = v.forma === "Saldo" || (v.dividir && v.forma2 === "Saldo");
  if (usaSaldo && !v.consumidor) return "Para pagar com saldo, escolha quem compra.";
  if (v.dividir) {
    if (!v.forma2 || v.forma2 === v.forma) return "Escolha a segunda forma, diferente da primeira.";
    const v2 = numDigitado(v.valor2);
    if (!(v2 > 0)) return "Digite quanto foi na segunda forma.";
    if (v2 >= total) return "A segunda forma precisa ser menor que o total.";
  }
  return "";
}
function pagamentoDe(v) {
  return { pagamento: v.forma, conta: v.forma === "Saldo" ? "" : (v.conta || contaPadrao(v.forma)),
    pagamento2: v.dividir ? v.forma2 : "", valor2: v.dividir ? r2(numDigitado(v.valor2)) : 0,
    conta2: v.dividir && v.forma2 !== "Saldo" ? (v.conta2 || contaPadrao(v.forma2)) : "" };
}
function substituir(codigoAntigo, codigoNovo) {        // a original fica riscada, ligada à nova
  const antiga = registro(codigoAntigo); if (!antiga) return;
  antiga.substituidaPor = codigoNovo; guardarRegistro(antiga);
}
function finalizar(comoEncomenda) {
  const v = T.v;
  if (v.cobrando) return cobrar();
  if (comoEncomenda) {
    if (!v.consumidor) { T.erro = "Para fazer uma encomenda, escolha quem compra."; desenhar(); return; }
    if (!v.itens.length) { T.erro = "Escolha pelo menos um produto."; desenhar(); return; }
    if (v.itens.some((i) => !(i.preco > 0))) { T.erro = "Há produto sem preço: toque no preço para digitar."; desenhar(); return; }
  } else {
    const erro = conferirVenda();
    if (erro) { T.erro = erro; desenhar(); return; }
  }
  if (!S.cfg.apelido) { T.erro = "Dê um apelido a este celular na tela Início antes de vender."; desenhar(); return; }
  const hoje = hojeISO(), cod = novoCodigo();
  const reg = Object.assign({
    tipo: comoEncomenda ? "encomenda" : "venda", codigo: cod, data: hoje, hora: horaAgora(), consumidor: v.consumidor || null,
    itens: v.itens.map((i) => ({ sku: i.sku, nome: i.nome, quantidade: i.quantidade, preco: r2(i.preco) })),
    total: totalItens(v.itens), entregar_depois: false, obs: (v.obs || "").trim(), desfeita: false, pendente: true
  }, comoEncomenda ? { pagamento: "A cobrar", conta: "", pagamento2: "", valor2: 0, conta2: "" } : pagamentoDe(v));
  if (v.editando) reg.edicaoDe = v.editando;
  S.vendas.push(reg);
  if (v.editando) substituir(v.editando, cod);
  S.exportadoEm = ""; guardar();
  T.v = vendaNova(); T.ultima = cod;
  T.msg = (reg.edicaoDe ? "Edição salva. " : "") + (comoEncomenda ? "Encomenda guardada: " : "Venda registrada: ") + quemDe(reg) + " · " + brl(reg.total) + ".";
  T.detalhe = cod; ir("detalhe");
}
function cobrar() {
  const v = T.v, r = registro(v.cobrando);
  if (!r || !emCurso(r)) { T.erro = "Esta encomenda não está mais em curso."; desenhar(); return; }
  const erro = conferirVenda();
  if (erro) { T.erro = erro; desenhar(); return; }
  if (!S.cfg.apelido) { T.erro = "Dê um apelido a este celular na tela Início antes de cobrar."; desenhar(); return; }
  Object.assign(r, pagamentoDe(v));
  r.cobrada = { data: hojeISO(), hora: horaAgora() };
  if (!r.hora) r.hora = r.cobrada.hora;
  if (v.obs && v.obs.trim() !== (r.obs || "")) r.obs = v.obs.trim();
  guardarRegistro(r); guardar();
  T.v = vendaNova(); T.msg = "Encomenda cobrada: " + quemDe(r) + " · " + brl(r.total) + ".";
  T.detalhe = r.codigo; ir("detalhe");
}
function comecarEdicao(codigo) {
  const r = registro(codigo); if (!r) return;
  T.v = vendaNova();
  T.v.consumidor = r.consumidor || null;
  T.v.itens = r.itens.map((i) => ({ sku: i.sku, nome: i.nome, quantidade: i.quantidade, preco: i.preco }));
  T.v.obs = r.obs || ""; T.v.editando = r.codigo; T.v.editandoEncomenda = ehEncomenda(r) && !r.cobrada;
  if (!T.v.editandoEncomenda) {
    T.v.forma = r.pagamento; T.v.conta = r.conta || ""; T.v.tocouForma = true;
    if (r.pagamento2) { T.v.dividir = true; T.v.forma2 = r.pagamento2; T.v.valor2 = String(r.valor2).replace(".", ","); T.v.conta2 = r.conta2 || ""; }
  } else if (T.v.consumidor) T.v.forma = "Saldo";
  T.buscaC = ""; T.buscaP = ""; ir("vender");
}
function comecarCobranca(codigo) {
  const r = registro(codigo); if (!r) return;
  T.v = vendaNova();
  T.v.consumidor = r.consumidor; T.v.itens = r.itens.map((i) => Object.assign({}, i)); T.v.obs = r.obs || "";
  T.v.forma = r.consumidor ? "Saldo" : "Dinheiro"; T.v.cobrando = r.codigo;
  ir("pagamento");
}

function finalizarAporte() {
  const v = T.v, val = r2(numDigitado(v.valorAporte));
  if (!v.consumidor) { T.erro = "Escolha de quem é o aporte."; desenhar(); return; }
  if (!(val > 0)) { T.erro = "Digite o valor recebido."; desenhar(); return; }
  if (!S.cfg.apelido) { T.erro = "Dê um apelido a este celular na tela Início antes de receber."; desenhar(); return; }
  const hoje = hojeISO();
  const reg = {
    tipo: "aporte", codigo: novoCodigo(), pendente: true,
    data: hoje, hora: horaAgora(), consumidor: v.consumidor, itens: [], total: val,
    pagamento: v.forma, conta: v.conta || contaPadrao(v.forma), pagamento2: "", valor2: 0, conta2: "",
    entregar_depois: false, obs: (v.obs || "").trim(), desfeita: false
  };
  S.vendas.push(reg); S.exportadoEm = ""; guardar();
  T.v = vendaNova(); T.msg = "Aporte registrado: " + reg.consumidor + " · " + brl(val) + ".";
  T.detalhe = reg.codigo; ir("detalhe");
}

function recibo(v) {
  if (ehAporte(v)) {
    const l = ["Rede Raízes da Mata · " + dataBR(v.data), "Para: " + v.consumidor, "", "Aporte recebido: " + brl(v.total) + " (" + v.pagamento + ")"];
    const c = consumidor(v.consumidor);
    if (c) l.push("Seu saldo: " + brl(saldoAgora(c)));
    return l.join("\n");
  }
  const l = ["Rede Raízes da Mata · " + dataBR(v.data)];
  if (v.consumidor) l.push("Para: " + v.consumidor);
  l.push("");
  v.itens.forEach((i) => l.push(qtd(i.quantidade) + " × " + i.nome + "  " + brl(i.quantidade * i.preco)));
  const ps = partes(v);
  if (emCurso(v)) { l.push("Total: " + brl(v.total)); l.push("Encomenda separada para você: o pagamento é na entrega."); return l.join("\n"); }
  l.push("Total: " + brl(v.total) + " (" + (ps.length > 1 ? ps.map((p) => p.forma + " " + brl(p.valor)).join(" + ") : ps[0].forma) + ")");
  if (v.entregar_depois) l.push("Encomenda: entregamos em breve.");
  const c = v.consumidor ? consumidor(v.consumidor) : null;
  if (c && parteSaldo(v) > 0) l.push("Seu saldo: " + brl(saldoAgora(c)));
  return l.join("\n");
}
function copiar(texto) {
  const fim = (ok) => { T.msg = ok ? "Recibo copiado. Cole no WhatsApp." : "Não consegui copiar: segure o dedo no recibo e copie."; desenhar(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(() => fim(true), () => fim(false));
  else { const a = document.createElement("textarea"); a.value = texto; document.body.appendChild(a); a.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} a.remove(); fim(ok); }
}

function opVenda(v, pagamentoForcado) {
  const op = { tipo: "venda", origem: "app", codigo: v.codigo, data: v.data, canal: "Feira", pagamento: pagamentoForcado || v.pagamento,
    itens: v.itens.map((i) => ({ sku: i.sku, quantidade: i.quantidade, preco: i.preco })) };
  if (v.consumidor) op.consumidor = v.consumidor;
  if (!pagamentoForcado) {
    if (v.conta) op.conta = v.conta;
    if (v.pagamento2) { op.pagamento2 = v.pagamento2; op.valor2 = v.valor2; if (v.conta2) op.conta2 = v.conta2; }
    if (v.entregar_depois) op.entregar_depois = true;
  }
  op.obs = (v.obs ? v.obs + " · " : "") + (v.edicaoDe ? "[edição da venda " + v.edicaoDe + "] · " : "") + "app " + S.cfg.apelido + (v.hora ? " " + v.hora : "");
  return op;
}
function arquivoDeVolta() {
  const agora = new Date(), carimbo = hojeISO().replace(/-/g, "") + "-" + p2(agora.getHours()) + p2(agora.getMinutes()) + p2(agora.getSeconds());
  const usados = new Set(registrosValidos().map((v) => v.consumidor).filter(Boolean));
  const ops = [], desfazer = [];
  let nV = 0, nA = 0, nE = 0, nC = 0, nD = 0;
  S.novos.filter((n) => usados.has(n.nome)).forEach((n) => ops.push({ tipo: "consumidor", nome: n.nome, contato: n.contato || "" }));
  S.vendas.forEach((v) => {
    if (fora(v)) {               // desfeita ou editada: só avisa o programa se ele pode ter recebido a original
      if (v.fromPacote || v.exportado) {
        desfazer.push({ tipo: "estorno", venda: v.codigo, data: hojeISO(), se_existir: true,
          motivo: v.substituidaPor ? "Editada no celular " + S.cfg.apelido + ": substituída pela venda " + v.substituidaPor : "Desfeita no celular " + S.cfg.apelido });
        nD++;
      }
      return;
    }
    if (ehAporte(v)) {
      ops.push({ tipo: "aporte", origem: "app", codigo: v.codigo, data: v.data, consumidor: v.consumidor, valor: v.total, conta: v.conta,
        descricao: "Aporte na feira (" + v.pagamento + ")" + (v.obs ? " · " + v.obs : "") + " · app " + S.cfg.apelido + " " + v.hora });
      nA++; return;
    }
    if (ehEncomenda(v)) {
      if (!v.fromPacote) { ops.push(opVenda(v, "A cobrar")); if (!v.cobrada) nE++; }
      if (v.cobrada) {
        const op = { tipo: "cobrar", origem: "app", venda: v.codigo, data: v.cobrada.data, pagamento: v.pagamento };
        if (v.conta) op.conta = v.conta;
        if (v.pagamento2) { op.pagamento2 = v.pagamento2; op.valor2 = v.valor2; if (v.conta2) op.conta2 = v.conta2; }
        ops.push(op); nC++;
      }
      return;
    }
    ops.push(opVenda(v)); nV++;
  });
  const partesTxt = [nV + " venda(s)"];
  if (nC) partesTxt.push(nC + " encomenda(s) cobrada(s)");
  if (nE) partesTxt.push(nE + " encomenda(s) a cobrar");
  if (nA) partesTxt.push(nA + " aporte(s)");
  if (nD) partesTxt.push(nD + " desfeita(s)/editada(s)");
  const dados = { versao: 2, codigo: "APP-" + S.cfg.apelido + "-" + carimbo, origem: "app",
    descricao: "Feira de " + dataBR(hojeISO()) + " · celular " + S.cfg.apelido + " · " + partesTxt.join(", "), operacoes: ops.concat(desfazer) };
  return { nome: "feira-" + S.cfg.apelido + "-" + carimbo, texto: JSON.stringify(dados, null, 1), vendas: nV + nA + nE + nC + nD };
}
function baixar(nome, texto) {
  const url = URL.createObjectURL(new Blob([texto], { type: "application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function marcarExportado(como) { S.exportadoEm = horaAgora(); S.vendas.forEach((v) => { if (!fora(v)) v.exportado = true; v.pendente = false; }); guardar(); T.msg = como; desenhar(); }
function exportar(modo) {
  const arq = arquivoDeVolta();
  if (!arq.vendas) { T.erro = "Ainda não há nada para exportar."; desenhar(); return; }
  if (modo === "compartilhar") {
    let f = null;
    try { f = new File([arq.texto], arq.nome + ".txt", { type: "text/plain" }); } catch (e) {}
    if (f && navigator.canShare && navigator.canShare({ files: [f] })) {
      navigator.share({ files: [f], title: "Feira " + S.cfg.apelido }).then(
        () => marcarExportado("Arquivo enviado. No computador: Feiras → App do celular (se mandou para o Drive, ele aparece sozinho na lista da pasta Volta)."),
        (e) => { if (e && e.name !== "AbortError") { baixar(arq.nome + ".json", arq.texto); marcarExportado("Não deu para compartilhar: o arquivo foi salvo na pasta Downloads. Mande pelo Drive (pasta Volta) ou pelo WhatsApp."); } });
      return;
    }
    baixar(arq.nome + ".json", arq.texto);
    marcarExportado("Este navegador não compartilha arquivos: salvei em Downloads (" + arq.nome + ".json). Mande pelo Drive (pasta Volta) ou pelo WhatsApp.");
    return;
  }
  baixar(arq.nome + ".json", arq.texto);
  marcarExportado("Cópia salva na pasta Downloads: " + arq.nome + ".json");
}
function novaFeira() {
  S.vendas = S.vendas.filter((v) => emCurso(v) && !v.fromPacote); S.exportadoEm = ""; guardar();     // encomendas em curso ficam

function avisoSaldo() {
  const v = T.v, c = v.consumidor ? consumidor(v.consumidor) : null, total = totalItens(v.itens), v2 = v.dividir ? numDigitado(v.valor2) : 0;
  const emSaldo = v.forma === "Saldo" ? r2(total - v2) : (v.dividir && v.forma2 === "Saldo" ? r2(v2) : 0);
  if (!(v.forma === "Saldo" || (v.dividir && v.forma2 === "Saldo"))) return "";
  if (!c) return '<div class="aviso">Para pagar com saldo, volte e escolha quem compra.</div>';
  const fica = r2(saldoAgora(c) - emSaldo);
  return fica < 0 ? '<div class="aviso">Fica com saldo de ' + valor(fica) + '. É fiado: a venda é gravada mesmo assim.</div>' : '<div class="sub">Depois da compra: saldo ' + valor(fica) + '.</div>';
}

function telaAporte() {
  const v = T.v, c = v.consumidor ? consumidor(v.consumidor) : null, val = numDigitado(v.valorAporte);
  const freq = consumidores().filter((x) => x.frequente).slice(0, 6);
  let h = topo("Receber valor", "inicio", "Início", true) + '<div class="corpo">' + avisos();
  h += '<div class="sub">Dinheiro que a pessoa deixa na conta dela, sem levar produto. Vira aporte no programa.</div>';
  h += '<label class="rot" for="bc">De quem</label><input class="campo" id="bc" autocomplete="off" placeholder="Buscar pelo nome" value="' + esc(T.buscaC) + '"><div id="lc">' + listaConsumidores() + '</div>';
  h += '<div class="chips">' + (c ? '<button class="chip on" data-a="cons" data-v="' + esc(c.nome) + '">' + esc(c.nome) + '</button>' : "") +
       freq.filter((x) => !c || x.nome !== c.nome).map((x) => '<button class="chip" data-a="cons" data-v="' + esc(x.nome) + '">' + esc(x.nome) + '</button>').join("") +
       '<button class="chip novo" data-a="cnovo">+ Cliente novo</button></div>';
  if (T.clienteNovo) h += '<div class="cartao"><h2>Cliente novo</h2><label class="rot" for="cn-nome">Nome</label><input class="campo" id="cn-nome" autocomplete="off"><label class="rot" for="cn-tel">Telefone</label><input class="campo" id="cn-tel" type="tel" inputmode="tel" autocomplete="off"><div class="duas"><button class="b" data-a="cnovo">Cancelar</button><button class="b p" data-a="ccriar">Cadastrar</button></div></div>';
  if (c) h += '<div class="sub">Saldo agora <b>' + valor(saldoAgora(c)) + '</b>' + (val > 0 ? ' · depois do aporte <b>' + valor(saldoAgora(c) + val) + '</b>' : "") + '</div>';
  h += '<label class="rot" for="valap">Valor recebido (R$)</label><input class="campo" style="width:170px;font-size:20px" id="valap" inputmode="decimal" autocomplete="off" value="' + esc(v.valorAporte) + '">';
  h += '<label class="rot">Forma</label>' + botoesForma(v.forma, "forma", "Saldo") + seletorConta("conta1", v.forma, v.conta);
  h += '<div id="pix">' + blocoPix() + '</div>';
  h += '<label class="rot" for="obs">Observação</label><input class="campo" id="obs" autocomplete="off" value="' + esc(v.obs) + '">';
  h += '</div><div class="rodape"><button class="b p g" style="flex:1" data-a="fimap">Registrar aporte</button></div>';
  return h;
}

function telaVendas() {
  const validas = vendasValidas(), total = r2(validas.reduce((s, v) => s + v.total, 0)), porForma = {};
  const aps = aportesValidos(), totalAp = r2(aps.reduce((s, v) => s + v.total, 0));
  validas.forEach((v) => partes(v).forEach((p) => { porForma[p.forma] = r2((porForma[p.forma] || 0) + p.valor); }));
  let h = topo("Vendas da feira", "inicio", "Início", false) + '<div class="corpo">' + avisos();
  h += '<div class="cartao"><div class="linha"><span class="sub">' + validas.length + ' venda(s)</span><span class="num">' + brl(total) + '</span></div><div class="duas" style="gap:4px 16px">' +
       FORMAS.map((f) => '<div class="linha" style="font-size:14px"><span class="sub">' + f + '</span><b>' + brl(porForma[f] || 0) + '</b></div>').join("") + '</div>' +
       (aps.length ? '<div class="linha" style="border-top:1px solid #E6ECE4;padding-top:8px"><span class="sub">' + aps.length + ' aporte(s) recebido(s)</span><b>' + brl(totalAp) + '</b></div>' : "") + '</div>';
  const enc = encomendasEmCurso();
  if (enc.length) {
    h += '<div class="rot">Encomendas · ' + enc.length + '</div>';
    h += enc.map((e) => '<button class="cartao enc" style="text-align:left;cursor:pointer" data-a="ver" data-v="' + esc(e.codigo) + '"><div class="linha"><b>' + esc(e.consumidor) + ' <span class="selo enc">encomenda</span></b><b>' + brl(e.total) + '</b></div><div class="sub">' + (e.fromPacote ? "do programa" : "deste celular") + " · " + e.itens.length + " item(ns) · " + esc(e.itens.slice(0, 3).map((i) => i.nome).join(", ")) + (e.itens.length > 3 ? "…" : "") + '</div></button>').join("");
    h += '<div class="rot">Vendas e aportes</div>';
  }
  const lista = S.vendas.filter((v) => !emCurso(v));
  const situacao = (v) => v.substituidaPor ? "editada → " + esc(v.substituidaPor) : v.desfeita ? "desfeita" + (v.exportado || v.fromPacote ? " (o programa desfaz)" : " (não vai para o programa)") : esc(pagamentoTexto(v));
  if (!lista.length) h += '<div class="sub">Nenhuma venda nem aporte ainda.</div>';
  else h += '<div class="cartao" style="gap:0">' + lista.slice().reverse().map((v) => '<div class="venda' + (fora(v) ? " riscada" : "") + '"><div style="min-width:0"><div class="quem">' + esc(quemDe(v)) + (ehAporte(v) ? ' <span class="selo aporte">aporte</span>' : "") + (ehEncomenda(v) ? ' <span class="selo enc">encomenda</span>' : "") + '</div><div class="sub">' + (v.cobrada ? v.cobrada.hora : v.hora) + " · " + situacao(v) + '</div></div><div class="linha"><b class="val">' + brl(v.total) + '</b><button class="b" style="min-height:44px;padding:0 10px;font-size:13px" data-a="ver" data-v="' + esc(v.codigo) + '">Ver ›</button></div></div>').join("") + '</div>';
  h += '<button class="b p g" data-a="exp" data-v="compartilhar"' + (S.vendas.length ? "" : " disabled") + '>Exportar e mandar para o programa</button>';
  h += '<button class="b" data-a="exp" data-v="baixar"' + (S.vendas.length ? "" : " disabled") + '>Salvar uma cópia neste celular</button>';
  h += '<div class="sub" style="text-align:center">' + (S.exportadoEm ? "Exportado às " + S.exportadoEm + ". " : "") + 'Pode exportar mais de uma vez: o programa não repete nada. Este celular guarda as 2 últimas feiras já exportadas e apaga as mais antigas sozinho.</div>';
  if (S.vendas.length) {
    h += T.confirmar === "zerar"
      ? '<div class="cartao"><div><b>Apagar todas as vendas deste celular?</b></div><div class="sub">As encomendas em curso feitas aqui ficam.</div><div class="sub">' + (S.exportadoEm ? "Faça isso só depois de aplicar o arquivo no programa." : "Atenção: as vendas ainda NÃO foram exportadas e serão perdidas.") + '</div><div class="duas"><button class="b" data-a="conf" data-v="">Cancelar</button><button class="b perigo" data-a="zerar">Apagar e começar nova feira</button></div></div>'
      : '<button class="b perigo" data-a="conf" data-v="zerar">Começar nova feira…</button>';
  }
  h += '</div>';
  return h;
}

function telaDetalhe() {
  const v = registro(T.detalhe);
  if (!v) return topo("Venda", "vendas", "Vendas", false) + '<div class="corpo"><div class="sub">Venda não encontrada.</div></div>';
  const c = v.consumidor ? consumidor(v.consumidor) : null, ps = partes(v);
  if (ehAporte(v)) return telaDetalheAporte(v, c);
  const curso = emCurso(v);
  let h = topo(curso ? "Encomenda" : "Venda" + (v.hora ? " das " + v.hora : ""), "vendas", "Vendas", !!c) + '<div class="corpo">' + avisos();
  if (v.substituidaPor) h += '<div class="aviso">Esta ' + (ehEncomenda(v) ? "encomenda" : "venda") + ' foi editada: a que vale é a ' + esc(v.substituidaPor) + '. <button class="b" style="min-height:40px;margin-top:6px;width:100%" data-a="ver" data-v="' + esc(v.substituidaPor) + '">Ver a nova</button></div>';
  else if (v.desfeita) h += '<div class="aviso">' + (v.exportado || v.fromPacote ? "Desfeita: na próxima exportação o programa desfaz esta venda." : "Esta venda foi desfeita e não vai para o programa.") + '</div>';
  if (v.edicaoDe) h += '<div class="sub">Edição da ' + esc(v.edicaoDe) + '.</div>';
  if (curso) h += '<div class="editando">Encomenda' + (v.fromPacote ? " montada no programa" : "") + ': ainda não foi cobrada. Dá para editar à vontade.</div>';
  h += '<div class="cartao"><div class="linha"><h2 style="font-size:17px">' + esc(quemDe(v)) + '</h2><span class="sub">' + esc(v.codigo) + '</span></div>' +
    v.itens.map((i) => '<div class="linha" style="font-size:15px"><span>' + qtd(i.quantidade) + " × " + esc(i.nome) + '</span><b>' + brl(i.quantidade * i.preco) + '</b></div>').join("") +
    '<div class="linha" style="font-size:18px;border-top:1px solid #E6ECE4;padding-top:8px"><b>Total</b><b>' + brl(v.total) + '</b></div>' +
    (curso ? "" : ps.map((p) => '<div class="linha sub"><span>' + p.forma + (p.conta ? " → " + esc(p.conta) : "") + '</span><b>' + brl(p.valor) + '</b></div>').join("")) + (v.cobrada ? '<div class="sub">Encomenda cobrada às ' + v.cobrada.hora + '.</div>' : "") +
    (v.entregar_depois ? '<div class="sub">Encomenda: entregar depois.</div>' : "") + (v.obs ? '<div class="sub">Observação: ' + esc(v.obs) + '</div>' : "") + '</div>';
  if (c) {
    const outras = S.vendas.filter((x) => x.consumidor === v.consumidor && x.codigo !== v.codigo && !fora(x) && !ehAporte(x));
    h += '<div class="cartao"><h2>' + esc(c.nome) + '</h2><div class="sub">Saldo no pacote ' + valor(c.saldo) + ' · depois das compras de hoje ' + valor(saldoAgora(c)) + '</div>';
    if (outras.length) h += '<div class="sub"><b>Outras compras nesta feira</b></div>' + outras.map((x) => '<div class="linha" style="font-size:14px"><span>' + x.hora + " · " + esc(x.itens.map((i) => qtd(i.quantidade) + " × " + i.nome).join(", ")) + '</span><b>' + brl(x.total) + '</b></div>').join("");
    const ant = c.compras || [];
    h += '<div class="sub"><b>Compras anteriores (últimos 2 meses)</b></div>' + (ant.length ? ant.map((x) => '<div class="linha" style="font-size:14px"><span>' + dataBR(x.data) + " · " + esc(x.itens) + '</span><b>' + valor(x.total) + '</b></div>').join("") : '<div class="sub">Nenhuma no pacote.</div>');
    h += '</div>';
  }
  if (curso) h += '<button class="b p g" data-a="cobrar" data-v="' + esc(v.codigo) + '">Cobrar ' + brl(v.total) + '</button>';
  if (!fora(v)) h += '<button class="b" data-a="editar" data-v="' + esc(v.codigo) + '">✏️ Editar ' + (curso ? "(itens ou cliente)" : "esta venda") + '</button>';
  h += '<pre class="recibo" id="recibo">' + esc(recibo(v)) + '</pre>';
  h += '<button class="b" data-a="copiar">Copiar recibo para o WhatsApp</button>';
  const nome = curso ? "encomenda" : "venda";
  if (v.substituidaPor) { /* editada: não se restaura */ }
  else if (v.desfeita) h += v.exportado || v.fromPacote ? '<div class="sub">Já foi enviada ao programa: para refazer, faça uma venda nova.</div>' : '<button class="b" data-a="restaurar">Restaurar esta venda</button>';
  else h += T.confirmar === "desfazer"
    ? '<div class="cartao"><div><b>' + (curso ? "Cancelar esta encomenda?" : "Desfazer esta venda?") + '</b></div><div class="sub">Ela fica riscada na lista' + (v.exportado || v.fromPacote ? " e o programa desfaz na próxima exportação." : " e não vai para o programa. Dá para restaurar depois.") + '</div><div class="duas"><button class="b" data-a="conf" data-v="">Não</button><button class="b perigo" data-a="desfazer">Sim, ' + (curso ? "cancelar" : "desfazer") + '</button></div></div>'
    : '<button class="b perigo" data-a="conf" data-v="desfazer">' + (curso ? "Cancelar esta encomenda…" : "Desfazer esta venda…") + '</button>';
  h += '<button class="b p g" data-a="outra"' + (S.pacote ? "" : " disabled") + '>Nova venda</button></div>';
  return h;
}

function telaDetalheAporte(v, c) {
  let h = topo("Aporte das " + v.hora, "vendas", "Vendas", true) + '<div class="corpo">' + avisos();
  if (v.desfeita) h += '<div class="aviso">Este aporte foi desfeito e não vai para o programa.</div>';
  h += '<div class="cartao"><div class="linha"><h2 style="font-size:17px">' + esc(v.consumidor) + '</h2><span class="sub">' + esc(v.codigo) + '</span></div>' +
    '<div class="linha" style="font-size:18px"><b>Aporte</b><b>' + brl(v.total) + '</b></div>' +
    '<div class="linha sub"><span>' + v.pagamento + (v.conta ? " → " + esc(v.conta) : "") + '</span></div>' +
    (v.obs ? '<div class="sub">Observação: ' + esc(v.obs) + '</div>' : "") +
    (c ? '<div class="sub">Saldo no pacote ' + valor(c.saldo) + ' · agora ' + valor(saldoAgora(c)) + '</div>' : "") + '</div>';
  h += '<pre class="recibo" id="recibo">' + esc(recibo(v)) + '</pre>';
  h += '<button class="b" data-a="copiar">Copiar recibo para o WhatsApp</button>';
  if (v.desfeita) h += '<button class="b" data-a="restaurar">Restaurar este aporte</button>';
  else h += T.confirmar === "desfazer"
    ? '<div class="cartao"><div><b>Desfazer este aporte?</b></div><div class="sub">Ele fica riscado na lista e não vai para o programa. Dá para restaurar depois.</div><div class="duas"><button class="b" data-a="conf" data-v="">Não</button><button class="b perigo" data-a="desfazer">Sim, desfazer</button></div></div>'
    : '<button class="b perigo" data-a="conf" data-v="desfazer">Desfazer este aporte…</button>';
  h += '<button class="b p g" data-a="aporte">Outro aporte</button></div>';
  return h;
}

function desenhar() {
  const telas = { inicio: telaInicio, vender: telaVender, pagamento: telaPagamento, vendas: telaVendas, detalhe: telaDetalhe, aporte: telaAporte };
  $("#app").innerHTML = (telas[T.tela] || telaInicio)();
  T.msg = "";
  const ep = $("#ep"); if (ep) { ep.focus(); ep.select(); }
  const cn = $("#cn-nome"); if (cn) cn.focus();
}

// ---------------------------------------------------------------- eventos
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-a]"); if (!b || b.disabled) return;
  const a = b.dataset.a, x = b.dataset.v;
  if (a === "ir") ir(x);
  else if (a === "olho") { S.cfg.esconder = !S.cfg.esconder; guardar(); desenhar(); }
  else if (a === "cons") escolherConsumidor(x);
  else if (a === "cnovo") { T.clienteNovo = !T.clienteNovo; T.erro = ""; desenhar(); }
  else if (a === "ccriar") criarCliente();
  else if (a === "add") adicionar(x);
  else if (a === "mais") mudarQtd(x, 1);
  else if (a === "menos") mudarQtd(x, -1);
  else if (a === "preco") { T.editarPreco = x; desenhar(); }
  else if (a === "pagar") { const er = T.v.itens.some((i) => !(i.preco > 0)) ? "Há produto sem preço: toque no preço para digitar." : ""; if (er) { T.erro = er; desenhar(); } else ir("pagamento"); }
  else if (a === "forma") { T.v.forma = x; T.v.tocouForma = true; T.v.conta = ""; if (T.v.forma2 === x) T.v.forma2 = ""; T.erro = ""; desenhar(); }
  else if (a === "forma2") { T.v.forma2 = x; T.v.conta2 = ""; T.erro = ""; desenhar(); }
  else if (a === "fim") finalizar(false);
  else if (a === "fimenc") finalizar(true);
  else if (a === "cobrar") comecarCobranca(x);
  else if (a === "editar") comecarEdicao(x);
  else if (a === "desistir") { const d = T.v.editando; T.v = vendaNova(); T.detalhe = d; ir("detalhe"); }
  else if (a === "fimap") finalizarAporte();
  else if (a === "aporte") { T.v = aporteNovo(); T.buscaC = ""; ir("aporte"); }
  else if (a === "ver") { T.detalhe = x; T.v = vendaNova(); ir("detalhe"); }
  else if (a === "conf") { T.confirmar = x; desenhar(); }
  else if (a === "desfazer" || a === "restaurar") { const v = registro(T.detalhe); if (v) { v.desfeita = a === "desfazer"; guardarRegistro(v); guardar(); } T.confirmar = ""; T.msg = v && ehAporte(v) ? (a === "desfazer" ? "Aporte desfeito." : "Aporte restaurado.") : (a === "desfazer" ? "Venda desfeita." : "Venda restaurada."); desenhar(); }
  else if (a === "copiar") { const v = registro(T.detalhe); if (v) copiar(recibo(v)); }
  else if (a === "outra") { T.v = vendaNova(); ir("vender"); }
  else if (a === "exp") exportar(x);
  else if (a === "zerar") novaFeira();
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "bc") { T.buscaC = t.value; $("#lc").innerHTML = listaConsumidores(); }
  else if (t.id === "bp") { T.buscaP = t.value; $("#lp").innerHTML = listaProdutos(); }
  else if (t.id === "valor2") { T.v.valor2 = t.value; $("#resumo").innerHTML = resumoDivisao(); $("#fiado").innerHTML = avisoSaldo(); $("#pix").innerHTML = blocoPix(); }
  else if (t.id === "obs") T.v.obs = t.value;
  else if (t.id === "valap") { T.v.valorAporte = t.value; $("#pix").innerHTML = blocoPix(); }
  else if (t.id === "apelido") { S.cfg.apelido = t.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8); guardar(); }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "arq" && t.files && t.files[0]) carregarPacote(t.files[0]);
  else if (t.id === "todos") { T.todos = t.checked; $("#lp").innerHTML = listaProdutos(); }
  else if (t.id === "dividir") { T.v.dividir = t.checked; if (!t.checked) { T.v.forma2 = ""; T.v.valor2 = ""; } else if (!T.v.forma2) T.v.forma2 = FORMAS.filter((f) => f !== T.v.forma)[0]; desenhar(); }
  else if (t.id === "contadia") { S.cfg.contaDia = t.value; guardar(); $("#temqr").innerHTML = temQr(); }
  else if (t.id === "conta1") { T.v.conta = t.value; $("#pix").innerHTML = blocoPix(); }
  else if (t.id === "conta2") { T.v.conta2 = t.value; $("#pix").innerHTML = blocoPix(); }
  else if (t.id === "apelido") desenhar();
  else if (t.id === "ep") aplicarPreco(t);
});
function aplicarPreco(t) {
  const it = T.v.itens.find((i) => i.sku === t.dataset.sku), n = numDigitado(t.value);
  if (it && n > 0) it.preco = r2(n);
  T.editarPreco = null; T.erro = ""; desenhar();
}
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.id === "ep") { e.preventDefault(); aplicarPreco(e.target); } });
document.addEventListener("focusout", (e) => { if (e.target.id === "ep" && T.editarPreco) aplicarPreco(e.target); });

desenhar();
if ("serviceWorker" in navigator) window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
</script>
</body>
</html>
